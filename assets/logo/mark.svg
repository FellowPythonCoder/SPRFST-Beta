<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SPRFST mark">
  <title>SPRFST</title>
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC46B"/>
      <stop offset="0.45" stop-color="#FFA136"/>
      <stop offset="1" stop-color="#E8761A"/>
    </linearGradient>
    <linearGradient id="amberDim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA136" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E8761A" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0B0B0D"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#1D1D20" stroke-width="2"/>

  <!-- speed trails -->
  <path d="M96 196 H208" stroke="url(#amberDim)" stroke-width="14" stroke-linecap="round"/>
  <path d="M72 256 H168" stroke="url(#amberDim)" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
  <path d="M104 316 H196" stroke="url(#amberDim)" stroke-width="14" stroke-linecap="round" opacity="0.45"/>

  <!-- the bolt: a single forward-leaning stroke folded once -->
  <path d="M300 64 L186 272 H266 L212 448 L430 214 H336 L404 64 Z" fill="url(#amber)"/>
  <path d="M300 64 L186 272 H266 L212 448 L430 214 H336 L404 64 Z" fill="none" stroke="#0B0B0D" stroke-width="10" stroke-linejoin="round"/>
</svg>
